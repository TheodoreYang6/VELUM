<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" preserveAspectRatio="xMidYMid slice" role="img" aria-label="VELUM 帷间 卡背">
  <defs>
    <linearGradient id="cbBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101a2c"/>
      <stop offset="0.55" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#080d16"/>
    </linearGradient>
    <pattern id="cbLattice" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 11 H22 M11 0 V22" stroke="#c8a45c" stroke-width="0.4" opacity="0.16"/>
    </pattern>
    <radialGradient id="cbGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c8a45c" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#c8a45c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="320" fill="url(#cbBg)"/>
  <rect width="200" height="320" fill="url(#cbLattice)"/>
  <circle cx="100" cy="160" r="92" fill="url(#cbGlow)"/>

  <!-- 卡面外框（三重金线） -->
